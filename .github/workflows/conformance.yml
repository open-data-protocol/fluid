# The gate that makes FLUID a standard rather than a schema with a docs site.
#
# Six jobs, deliberately separate so a red build says WHICH promise broke:
#
#   meta         proves the gates below can fail. Runs first: a green
#                conformance run means nothing if the runner cannot go red.
#   conformance  runs the vector corpus against the published schemas, and
#                again against the reference implementation (forge-cli) so
#                the corpus and the engine cannot drift apart unnoticed.
#   compat       enforces the backward-compatibility promise the README and
#                every release note make.
#   drift        the vendored schemas are byte-identical to the ones the
#                reference implementation's latest release ships. This used
#                to live in schema-sync.yml, which compared against forge-cli
#                `main`, failed every scheduled run from 22 June to 31 August
#                2026, and was then disabled by GitHub for inactivity, so
#                later pull requests merged with no drift check at all.
#   generated    specs/ (the HTML reference) and schema-diffs/ are what the
#                generators produce from schema/ today.
#   docs-links   internal absolute links in docs/ carry the /fluid/ base.
#                Moved here from link-check.yml for the same reason as drift.
#
# GitHub's inactivity rule disables only workflows that have a `schedule`
# trigger, and it disables the whole workflow, pull-request checks included.
# That is why this workflow has no schedule, and why per-PR gates live here
# rather than beside a weekly job.

name: conformance

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "tests/**"
      - "conformance/**"
      - "scripts/**"
      - "specs/**"
      - "schema-diffs/**"
      - "generate-docs.py"
      - "generate-schema-diffs.py"
      - ".github/workflows/conformance.yml"
  # NO `paths:` filter here, and that is the point. A path-filtered check
  # cannot be a REQUIRED check: on a pull request that does not match, the
  # context never reports at all, and branch protection waits for a report
  # that will never come. The pull request hangs, permanently, with nothing
  # to click.
  #
  # That is not hypothetical for this repo. PR #47 (a docs PR) only received
  # these three checks because it happened to also touch conformance/run.py,
  # and PR #48 — LICENSE and CONTRIBUTING.md — reported no checks at all.
  #
  # The push trigger above keeps its filter: nothing waits on a push, so
  # skipping the corpus for a README typo on main costs nothing and saves a
  # runner. On pull requests the corpus is ~40s, which is cheaper than one
  # person wondering why their PR will not merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: gates can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The [format] extra is REQUIRED, not optional polish: without it,
      # jsonschema silently registers no checker for date-time (it needs
      # rfc3339-validator), so tests/optional/ format assertions pass
      # vacuously in one environment and fail in another. Pinning the extra
      # is what makes a local run and a CI run mean the same thing.
      - run: pip install "jsonschema[format]>=4.22"
      - name: prove the conformance runner and compat gate can go red
        run: python3 tests/meta_test.py

  conformance:
    name: corpus
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The [format] extra is REQUIRED, not optional polish: without it,
      # jsonschema silently registers no checker for date-time (it needs
      # rfc3339-validator), so tests/optional/ format assertions pass
      # vacuously in one environment and fail in another. Pinning the extra
      # is what makes a local run and a CI run mean the same thing.
      - run: pip install "jsonschema[format]>=4.22"

      - name: run the corpus against the published schemas
        run: python3 conformance/run.py --junit conformance-report.xml

      # What the corpus is WORTH, not just whether it is green.
      #
      # `run.py` answers "do the cases pass" — a corpus of zero cases answers
      # that perfectly. `mutation_coverage.py` answers the harder question:
      # delete a constraint from the schema and see whether any case notices.
      # It used to sit in this repo, runnable and wired into nothing, so the
      # figure it produces could fall to zero between releases in silence.
      #
      # The floor is the CURRENT number rounded down, not a target: the
      # lowest version is 0.7.5 at 41.0% (tests/README.md has the figures).
      # That is the convention mutation-testing gates converge on
      # (Stryker, mutmut): set the break threshold where you actually are, so
      # it catches a regression on day one — an aspirational threshold goes red
      # immediately and gets deleted by day three, which is worse than no gate.
      #
      # Deliberately NOT a ratchet. Ratchets exist to absorb run-to-run noise
      # and there is none here: the run is deterministic — mutate the schema,
      # replay the corpus, count. Raising the floor is a deliberate edit to
      # this line, made when a corpus wave earns it.
      - name: the corpus still kills the mutations it used to
        run: python3 conformance/mutation_coverage.py --min-coverage 40

      # The corpus defines conformance; forge-cli is implementation #1 under
      # test, never the referee. Installing latest-stable here is deliberate:
      # it is how the Command Center installs it, so a divergence between the
      # standard and the engine surfaces on this repo's PRs rather than in a
      # customer's container.
      - name: install the reference implementation
        run: pip install data-product-forge
        continue-on-error: true
        id: install_forge

      - name: check the reference implementation against the corpus
        if: steps.install_forge.outcome == 'success'
        run: python3 conformance/check_reference.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.xml

  compat:
    name: backward compatibility
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The [format] extra is REQUIRED, not optional polish: without it,
      # jsonschema silently registers no checker for date-time (it needs
      # rfc3339-validator), so tests/optional/ format assertions pass
      # vacuously in one environment and fail in another. Pinning the extra
      # is what makes a local run and a CI run mean the same thing.
      - run: pip install "jsonschema[format]>=4.22"

      # The default run compares every adjacent pair from 0.7.1, the first
      # version the compatibility promise covers, to the newest published
      # schema, so a newly vendored version is covered without editing this
      # file. Earlier pairs predate the promise (`--all-history` shows them).
      - name: every release keeps its backward-compatibility promise
        run: python3 scripts/check-compat.py

  drift:
    name: schemas match the reference release
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Resolves forge-cli's latest release at run time and compares every
      # version listed in scripts/schema-versions.json byte for byte, plus the
      # release's preview set and the latest stable version. A release, not
      # `main`: main carries unreleased schema edits nobody can install yet.
      # The token only lifts the API rate limit; forge-cli is public.
      - name: vendored schemas equal the latest forge-cli release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-schema-drift.py

  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The renderer is pinned exactly: the HTML is committed, so its version
      # is part of the build's input (see scripts/requirements-docs.txt).
      - run: pip install -r scripts/requirements-docs.txt
      - name: specs/<version>/ matches a fresh render of every synced schema
        run: python3 generate-docs.py --check
      - name: schema-diffs/ matches a fresh generation
        run: python3 generate-schema-diffs.py --check

  docs-links:
    name: docs links carry the site base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all internal absolute links carry the /fluid/ base
        run: |
          # VuePress base is /fluid/. Sidebar/navbar links auto-prefix, but
          # body markdown links do NOT -- an absolute link like [x](/schema/foo)
          # renders as <a href="/schema/foo"> and 404s on the live site.
          PREFIXES='guide|concepts|schema|examples|how-to|releases|vision|contributing|deck|specs'

          if grep -rIn -E "\]\(/(${PREFIXES})[^)]*\)" docs/ --include="*.md" \
             | grep -v "(/fluid/" ; then
            echo ""
            echo "::error::Found internal absolute markdown links missing the /fluid/ base prefix."
            echo "::error::These render as <a href=\"/schema/...\"> and 404 on the live site."
            echo "::error::Fix: rewrite [text](/schema/foo) -> [text](/fluid/schema/foo) (or use a relative path)."
            exit 1
          fi
          echo "All internal absolute body links carry the /fluid/ base."
