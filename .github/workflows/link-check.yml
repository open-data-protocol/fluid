name: Link Check

# External URLs in docs/, checked weekly (lychee), opening an issue when any
# break. Scheduled only: it does not run on pull requests.
#
# The per-PR base-prefix check that used to live here (absolute body links
# missing the /fluid/ base) is now the `docs-links` job in conformance.yml.
# This workflow has a `schedule` trigger, so GitHub disables it after 60 days
# without repository activity -- and it was disabled that way, taking the
# pull-request check down with it. A disabled scheduled workflow is re-enabled
# from the Actions tab or with `gh workflow enable "Link Check"`.

on:
  schedule:
    - cron: "13 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    name: External URLs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee on external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --max-concurrency 8
            --timeout 20
            --exclude-loopback
            --exclude-mail
            './docs/**/*.md'
          fail: false

      - name: Open issue if external links broke
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link Check: broken external links found"
          content-filepath: ./lychee/out.md
          labels: docs, link-check
